# Render Blueprint — Static Site
# Dashboard: New → Blueprint → connect github.com/tahlil29/space_game
services:
  - type: web
    name: space-survival
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
