# Render Blueprint — use Static Site (NOT Web Service)
# New → Blueprint, or New → Static Site with the same build settings below.
# Free tier first deploy can sit in a queue; later deploys are faster.
services:
  - type: web
    name: space-survival
    runtime: static
    plan: free
    buildCommand: npm install --no-audit --no-fund && npm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - src/**
        - public/**
        - index.html
        - package.json
        - package-lock.json
        - vite.config.js
        - render.yaml
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
